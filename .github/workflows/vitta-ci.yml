name: VITTA — verificações

on:
  push:
    paths: ['vitta/**', '.github/workflows/vitta-ci.yml']
  pull_request:
    paths: ['vitta/**', '.github/workflows/vitta-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: vitta

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vitta/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
